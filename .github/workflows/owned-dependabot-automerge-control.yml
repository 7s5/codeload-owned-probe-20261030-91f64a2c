name: Owned Dependabot unattended merge control

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

jobs:
  owned-unattended-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      (startsWith(github.event.pull_request.title, '[owned-automerge-proof]') ||
       startsWith(github.event.pull_request.title, '[owned-automerge-cleanup]'))
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the inherited proof check
        if: startsWith(github.event.pull_request.title, '[owned-automerge-proof]')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          result=""
          for attempt in $(seq 1 60); do
            result="$(gh api "repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs" --jq '.check_runs[] | select(.name == "owned-required-check-automerge-control") | .conclusion' | tail -n 1)"
            if [ "$result" = "success" ]; then
              break
            fi
            sleep 5
          done
          test "$result" = "success"
      - name: Merge the owned control PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash "$PR_URL"
